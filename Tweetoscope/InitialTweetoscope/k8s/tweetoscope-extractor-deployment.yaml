apiVersion: apps/v1
kind: Deployment
metadata:
  name: tweetoscope-extractor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tweetoscope-extractor
  template:
    metadata:
      labels:
        app: tweetoscope-extractor
    spec:
      containers:
      - name: extractor
        image: registry.gitlab.centralesupelec.fr/louca.malerba/tweetoscope25_group-10_lemaitre_thievon_malerba:latest
        env:
        - name: SERVICE_JAR
          value: "KafkaHashtagExtractor"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: TOPIC_INPUT
          value: "filtered-tweets"
        - name: TOPIC_OUTPUT
          value: "hashtags"
