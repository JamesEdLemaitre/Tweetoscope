apiVersion: apps/v1
kind: Deployment
metadata:
  name: tweetoscope-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tweetoscope-counter
  template:
    metadata:
      labels:
        app: tweetoscope-counter
    spec:
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - name: counter
        image: registry.gitlab.centralesupelec.fr/louca.malerba/tweetoscope25_group-10_lemaitre_thievon_malerba:latest
        env:
        - name: SERVICE_JAR
          value: "KafkaHashtagCounter"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: TOPIC_INPUT
          value: "hashtags"
        - name: TOPIC_OUTPUT
          value: "leaderboards"
