apiVersion: apps/v1
kind: Deployment
metadata:
  name: tweetoscope-leaderboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tweetoscope-leaderboard
  template:
    metadata:
      labels:
        app: tweetoscope-leaderboard
    spec:
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - name: leaderboard
        image: registry.gitlab.centralesupelec.fr/louca.malerba/tweetoscope25_group-10_lemaitre_thievon_malerba:latest
        env:
        - name: SERVICE_JAR
          value: "KafkaLeaderboard"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: TOPIC_INPUT
          value: "leaderboards"
        ports:
        - containerPort: 8080

