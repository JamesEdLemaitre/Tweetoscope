stages:
  - test JUnit
  - quality
  - publish CR to Gitlab Pages

# Job pour exécuter les tests JUnit
JUnit-test-filter:
  stage: test JUnit
  image: maven:3.9-eclipse-temurin-11
  tags:
    - docker
  script:
    - cd Tweetoscope/InitialTweetoscope
    - mvn clean test -Dtest=KafkaTweetFilterTest -X
  artifacts:
    when: always
    reports:
      junit: 
        - Tweetoscope/InitialTweetoscope/target/surefire-reports/TEST-*.xml
    paths:
      - Tweetoscope/InitialTweetoscope/target/surefire-reports/
  only:
    - main
    - master

# Job pour analyser la qualité du code avec SonarQube
sonarqube-scan:
  stage: quality
  image: maven:3.9-eclipse-temurin-11
  tags:
    - docker
  services:
    - name: sonarqube:10.3-community
      alias: sonarqube
  variables:
    SONAR_HOST_URL: http://sonarqube:9000
    SONAR_LOGIN: admin
    SONAR_PASSWORD: admin
  script:
    - cd Tweetoscope/InitialTweetoscope
    # Attendre que SonarQube soit complètement prêt
    - echo "Waiting for SonarQube to be ready..."
    - |
      for i in {1..60}; do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://sonarqube:9000/api/system/health 2>/dev/null)
        if [ "$STATUS" = "200" ]; then
          echo "SonarQube is ready!"
          break
        fi
        echo "Attempt $i/60: HTTP status $STATUS, waiting..."
        sleep 2
      done
    # Vérifier que SonarQube est vraiment UP
    - sleep 10
    - curl -s http://sonarqube:9000/api/system/health | grep -q '"status":"UP"' && echo "SonarQube is UP!" || (echo "SonarQube failed to start properly" && exit 1)
    # Lancer l'analyse
    - mvn clean verify sonar:sonar 
      -Dsonar.projectKey=tweetoscope
      -Dsonar.projectName=Tweetoscope
      -Dsonar.sources=src/main/java
      -Dsonar.tests=src/test/java
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_LOGIN
      -Dsonar.password=$SONAR_PASSWORD
      -Dsonar.scm.disabled=false
  artifacts:
    when: always
    paths:
      - Tweetoscope/InitialTweetoscope/target/
    expire_in: 30 days
  only:
    - main
    - master
  allow_failure: true


pages:
  stage: publish CR to Gitlab Pages
  image: texlive/texlive:latest
  tags:
    - docker
  script:
    - mkdir -p public
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
  artifacts:
    paths:
      - public
  only:
    - main
    - master
