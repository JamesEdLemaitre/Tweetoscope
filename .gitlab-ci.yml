stages:
  - test
  - build
  - publish

# Job pour exécuter les tests JUnit
test-filter:
  stage: test
  image: maven:3.9-eclipse-temurin-11
  tags:
    - docker
  script:
    - cd Tweetoscope/InitialTweetoscope
    - mvn clean test -Dtest=KafkaTweetFilterTest -X
  artifacts:
    when: always
    reports:
      junit: 
        - Tweetoscope/InitialTweetoscope/target/surefire-reports/TEST-*.xml
    paths:
      - Tweetoscope/InitialTweetoscope/target/surefire-reports/
  only:
    - main
    - master

# Job pour builder et publier l'image Docker au GitLab Container Registry avec Kaniko
build-docker:
  stage: build
  image: gcr.io/kaniko-project/executor:latest
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
  entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor 
        --context $CI_PROJECT_DIR/Tweetoscope/InitialTweetoscope 
        --dockerfile $CI_PROJECT_DIR/Tweetoscope/InitialTweetoscope/Dockerfile
        --destination $CI_REGISTRY_IMAGE:$IMAGE_TAG 
        --destination $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - master

pages:
  stage: publish
  image: texlive/texlive:latest
  tags:
    - docker
  script:
    - mkdir -p public
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
  artifacts:
    paths:
      - public
  only:
    - main
    - master
