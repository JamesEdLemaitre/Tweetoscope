stages:
  - build
  - publish

# Job pour builder et publier l'image Docker au GitLab Container Registry
build-docker:
  stage: build
  image: gcr.io/kaniko-project/executor:latest
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR/Tweetoscope/InitialTweetoscope --dockerfile Dockerfile --destination $CI_REGISTRY_IMAGE:$IMAGE_TAG --destination $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - master

pages:
  stage: publish
  image: texlive/texlive:latest
  tags:
    - docker
  script:
    - mkdir -p public
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
  artifacts:
    paths:
      - public
  only:
    - main
    - master
