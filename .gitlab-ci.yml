stages:
  - build
  - publish

# Job pour builder et publier l'image Docker au GitLab Container Registry
build-docker:
  stage: build
  image: quay.io/buildah/stable
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
  tags:
    - docker
  script:
    - cd Tweetoscope/InitialTweetoscope
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - buildah bud -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - buildah tag $CI_REGISTRY_IMAGE:$IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - buildah push $CI_REGISTRY_IMAGE:$IMAGE_TAG
    - buildah push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - master

pages:
  stage: publish
  image: texlive/texlive:latest
  tags:
    - docker
  script:
    - mkdir -p public
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
  artifacts:
    paths:
      - public
  only:
    - main
    - master
