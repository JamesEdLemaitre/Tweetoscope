stages:
  - build
  - publish

# Job pour builder et publier l'image Docker au GitLab Container Registry
build-docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_REGISTRY: registry.gitlab.centralesupelec.fr
    IMAGE_NAME: $CI_PROJECT_PATH
    IMAGE_TAG: $CI_COMMIT_SHA
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $IMAGE_REGISTRY
  script:
    - cd Tweetoscope/InitialTweetoscope
    - docker build -t $IMAGE_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
    - docker build -t $IMAGE_REGISTRY/$IMAGE_NAME:latest .
    - docker push $IMAGE_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_REGISTRY/$IMAGE_NAME:latest
  only:
    - main
    - master

pages:
  stage: publish
  image: texlive/texlive:latest
  tags:
    - docker
  script:
    - mkdir -p public
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
    - pdflatex -interaction=nonstopmode -output-directory=public CR.tex
  artifacts:
    paths:
      - public
  only:
    - main
    - master
